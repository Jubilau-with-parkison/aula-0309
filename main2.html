<meta charset="UTF-8">
<script>
    class Conta {
        #saldo
        #tipo
        constructor({nome, saldo=0, tipo="comum"} = {}){
            this.#saldo = saldo;
            this.#tipo = tipo;
            this.nome = nome;
        }
        depositar(valorD){
            this.#saldo += valorD;
            console.log(`Sr(a) ${this.nome} depositou R$${valorD} agora sua conta está com R$${this.#saldo} ,em sua conta ${this.#tipo}`)
        }
        sacar(valorS){
            this.#saldo -= valorS
            console.log(`Sr(a) ${this.nome} sacou ${valorS} agora sua conta está com R$${this.#saldo} ,em sua conta ${this.#tipo}`)
        }
        consultar(){
            console.log(`Sr(a) ${this.nome} saldo atual: R$${this.#saldo} conta ${this.#tipo}`)
        }
        get saldo() { return this.#saldo;}
        get tipo() { return this.#tipo;}
    }

    let conta1 = new Conta({nome: "Arnesto", tipo: "de investimentos"});
    conta1.consultar();
    conta1.depositar(10000);
    conta1.sacar(1001);

    let conta2 = new Conta({nome: "Emilia", saldo: 80000, tipo: "de herança"});
    conta2.consultar();
    conta2.depositar(0);
    conta2.sacar(80000);

    let conta3 = new Conta({nome: "Dorival", saldo: 900, tipo: "de pessoa juridica"});
    conta3.consultar();
    conta3.depositar(100);
    conta3.sacar(0);

    let conta4 = new Conta({nome: "Adoniran", saldo: 500});
    conta4.consultar();
    conta4.depositar(900);
    conta4.sacar(10);
</script>
